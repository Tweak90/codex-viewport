name: codex-api
services:
  gateway:
    image: codex-vm-console:1.0.0
    build: .
    command: ["node", "gateway.mjs"]
    restart: unless-stopped
    init: true
    user: "${CODEX_UID:-1000}:${CODEX_GID:-1000}"
    ports:
      - "${API_BIND_IP:-0.0.0.0}:${API_PORT:-4500}:4500"
    environment:
      GATEWAY_PORT: 4500
      CODEX_SOCKET: /run/codex/app-server-control.sock
      CODEX_API_TOKEN: ${CODEX_API_TOKEN:-}
    volumes:
      - type: bind
        source: ${CODEX_SOCKET_DIR:-${HOME}/.codex/app-server-control}
        target: /run/codex
        read_only: true
        bind:
          create_host_path: false
      # Codex 0.166 uses an absolute symlink into this runtime directory.
      - type: bind
        source: ${CODEX_RUNTIME_SOCKET_DIR:-/tmp/codex-daemon-1000}
        target: ${CODEX_RUNTIME_SOCKET_DIR:-/tmp/codex-daemon-1000}
        read_only: true
        bind:
          create_host_path: false
